schema_version: 1
profile_id: zuno-server-product-dr-profile
status: target_not_measured
owner: Infrastructure
recovery_owner: Infrastructure Restore Owner

boundary: >-
  This profile defines the current recovery contract. PostgreSQL facts, object
  manifests, outbox delivery, checkpoints and derived projections must be
  restored from authoritative sources and revalidated before serving traffic.
  The repository does not claim production RPO/RTO or an encrypted backup
  custody measurement from local tests.

authoritative_components:
  - postgresql_domain_store
  - object_manifest_and_object_store
  - outbox_inbox_delivery
  - agent_runtime_checkpoint
  - product_projection

recovery_invariants:
  - queue receipt is not domain success
  - derived projections are rebuilt from authoritative facts
  - external effect uncertainty enters reconciliation
  - security and budget facts are revalidated after restore
  - recovered runs remain idempotent

evidence_refs:
  - docs/evidence/current-runtime-baseline.md
  - docs/evidence/current-test-baseline.md

measurement_status: not_measured
production_readiness: NOT_ESTABLISHED
