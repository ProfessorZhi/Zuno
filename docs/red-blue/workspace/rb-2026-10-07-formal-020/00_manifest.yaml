# 本轮第一个实质方法变更：不再生成 100 个独立知识点，而是 10 条 Interview Thread。
# 100 题规模不变，但内部按 Thread 组织，Red 必须跨题保持状态并回钩。
thread_taxonomy:
  source: docs/governance/interview-acceptance-standard.md §3
  thread_count: 10
  threads:
    - id: T01
      name: Tool / MCP
      spine: 本人做了什么 → config injection → 并发隔离 → timeout → idempotency → remote effect → 为什么不直接买现成 Host
    - id: T02
      name: GraphRAG
      spine: 原 bad case → fusion 修复 → threshold → 5-query smoke → holdout/ablation → latency/cost → kill condition
    - id: T03
      name: Memory / Context
      spine: 为什么需要 → record owner → recall authority → revocation → stale memory → Domain conflict → A/B → 什么条件下删除
    - id: T04
      name: Runtime
      spine: 为什么 fixed workflow 不够 → PlanVersion → late result → Domain commit / stale checkpoint → recovery authority → 为什么不用纯 LangGraph
    - id: T05
      name: Security / Effect
      spine: authorization freshness → audit-before-effect → crash window → unknown effect → reconciliation → external reality
    - id: T06
      name: Project History
      spine: 加入时已有多少 → 本人第一笔改动 → 哪些是团队做的 → 哪些是今天 Target 而非当年实现
    - id: T07
      name: Pilot / 法院
      spine: 到底发生过什么 → 什么没证据 → 为什么不能叫 Production
    - id: T08
      name: 系统简化
      spine: 如果今天重做，哪些模块 / 机制可以删
    - id: T09
      name: Knowledge / Retrieval fundamentals
      spine: DocumentVersion → KnowledgeGeneration → Readiness → Citation → 「全案没有」怎样证明
    - id: T10
      name: Engineering fundamentals
      spine: Python / PostgreSQL / 并发 / 网络 / IR / Agent 基础，把「会不会写代码」打穿

