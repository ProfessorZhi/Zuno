    - claim: Q113（audit 是 qwen-plus、rerun 是 deepseek ⇒ 换模型污染归因）
      verdict: PREMISE_REFUTED
      how: >
        `a25c95a2`（2026-06-20 15:12 "Align multihop eval profile with DeepSeek default"）把受版本管理 profile 的
        `conversation_model` 由 `qwen-plus` 改为 `deepseek-v4-flash`，且它是 audit `7928df50`、rerun `3da5d742`
        与输入 `c3d06da3` 的**共同祖先** ⇒ audit 与 rerun 同模型，换模型发生在更早的 smoke。
        Blue-2a 的撤回成立；且它诚实拒绝把恢复归因给 fusion 修复（baseline 自身数字同日漂移），
        与本轮边界声明「local 与 baseline 打平」一致。
    - claim: A169/A68（fusion 是图层护栏，删图路由则 fusion 同去；baseline-preserving 不是全局不变量）
      verdict: CONFIRMED
      how: >
        `platform/services/retrieval/fusion.py:922` `selected[weakest_index] = candidate`；
        `:943` `floor_preserved = promoted_candidate is None`（地板在被晋升时被允许不保留）；
        `_rank_key` 返回 `(candidate_group, baseline_rank, …)`，baseline_rank 为主序分量。
        同处确认 A198：`fusion_score` 只写 metadata、不进返回元组 ⇒ trace-only, decision-free。
    - claim: A172/A73+A74（alias 归一化与 seed expansion 是同一机制两半）+ A168（fuzzy 分支是 no-op）
      verdict: CONFIRMED
      how: >
        `platform/services/graphrag/entity_alias.py:25-32` `normalize_entity_name`、`:35-61` `resolve_alias`；
        归一化结果即 seed 站点用的名字 ⇒ 别名层是 seed 命中率的前置条件。
        fuzzy 分支（`allow_fuzzy` 循环）只做 `normalized_candidate == normalized_known` 精确比较，
        而该相等已在上面 `if normalized_candidate in normalized_map` 处返回 ⇒ **死分支，永不命中新项**。
