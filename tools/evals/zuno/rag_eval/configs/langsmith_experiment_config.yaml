langsmith_experiment:
  enabled: false
  project: "Zuno"
  experiment_name_pattern: "zuno-phase22-{suite_version}-{profile_id}-{commit_short_sha}"
  metadata_schema:
    - suite_id
    - slice_id
    - dataset_hash
    - corpus_hash
    - case_id
    - profile_id
    - model_hash
    - judge_hash
    - threshold_hash
    - git_commit_sha
    - agent_run_id
    - eval_run_id
    - trace_id
