datasets:
  - source_id: "microsoft_graphrag_benchmarking"
    official_name: "Microsoft GraphRAG Benchmarking Datasets"
    official_repository: "https://github.com/microsoft/graphrag"
    upstream_commit_or_version: "v0.5.0"
    license: "MIT"
    license_file_ref: "LICENSE"
    citation: "Edge et al., 2024. From Local to Global: A Graph RAG Approach to Query-Focused Summarization."
    download_method: "official_http"
    expected_files:
      - "kevin_scott_podcast/documents.jsonl"
      - "kevin_scott_podcast/questions.jsonl"
