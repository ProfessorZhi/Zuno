    corpus_type: "podcast_transcripts"
    question_type: "global_summary"
    answer_ground_truth: true
    evidence_ground_truth: true
    supporting_fact_granularity: "community_summary"
    redistribution_policy: "allowed_with_attribution"
    local_cache_path: ".local/eval-datasets/microsoft_graphrag"
    adapter: "tools.evals.zuno.rag_eval.datasets.adapters.microsoft_graphrag_adapter"
    status: "verified_candidate"

