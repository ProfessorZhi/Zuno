name: Reader simulation narrative pass

on:
  push:
    branches:
      - docs/reader-simulation-pass-v1

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reader-simulation-pass-v1
          fetch-depth: 0

      - name: Apply reader-simulation edits
        run: python .github/reader_simulation_edit.py

      - name: Commit narrative improvements and remove helper files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/reader_simulation_edit.py .github/workflows/reader-simulation-pass.yml
          git add docs/README.md docs/project/project.md docs/architecture/architecture.md docs/modules/README.md docs/governance/architecture-narrative-quality-standard.md
          git commit -m "docs: improve first-read navigation"
          git push origin HEAD:docs/reader-simulation-pass-v1
