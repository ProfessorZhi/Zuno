name: Inventory core narratives

on:
  push:
    branches: [docs/core-narrative-continuity]
    paths:
      - ".github/workflows/inventory-core-narratives.yml"

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/core-narrative-continuity
      - name: Print structure and editorial patterns
        run: |
          for file in docs/project/README.md docs/architecture/README.md; do
            echo "===== $file headings ====="
            grep -nE '^#{2,4} ' "$file" || true
            echo "===== $file editorial/meta ====="
            grep -nE '本节|本文|这一篇|第一次阅读|接下来|前半|后半|到这里|下面|二刷|Main Story|Stress Test|可以先|可以停|先看|再看|为什么' "$file" || true
            echo "===== $file contrast ====="
            grep -nE '不是.*而是|不是“|不等于|真正.*是|核心.*是' "$file" || true
            echo
          done
