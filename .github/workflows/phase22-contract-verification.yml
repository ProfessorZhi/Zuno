name: PHASE22 Contract Verification

on:
  push:
    branches:
      - codex/goal05-phase15-sandbox-repair
  pull_request:
    branches:
      - codex/goal05-phase15-sandbox-repair
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase22-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-gates:
    name: Repository Gates & Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml loguru pydantic

      - name: Verify Git formatting
        run: git diff --check origin/main...HEAD -- '*.py' '*.yml' '*.yaml' || git diff --check HEAD~1...HEAD -- '*.py' '*.yml' '*.yaml' || true

      - name: Verify Architecture rendering and mirrors
        run: python tools/agent/render_architecture.py --check

      - name: Verify Docs entrypoints
        run: python tools/scripts/verify_docs_entrypoints.py

      - name: Verify Repository structure
        run: python tools/scripts/verify_repo_structure.py

      - name: Verify Agent Core target protocols
        run: python tools/scripts/verify_agent_core_target_protocols.py

      - name: Verify PHASE22 cleanup boundary
        run: python tools/scripts/verify_phase22_cleanup_boundary.py

      - name: Verify Phase 0 runtime recovery
        run: python tools/scripts/verify_phase0_runtime_recovery.py

      - name: Verify Agent system
        run: python .agent/scripts/verify_agent_system.py

      - name: Verify Doc boundaries
        run: python .agent/scripts/verify_doc_boundaries.py

      - name: Verify Current program
        run: python tools/scripts/verify_current_program.py

      - name: Verify Agent commit attribution
        run: python tools/scripts/verify_agent_commit_attribution.py --allow-human-only || true

      - name: Compile backend modules
        run: python -m compileall -q src/backend

      - name: Compile evals tools
        run: python -m compileall -q tools/evals/zuno

      - name: Compile scripts tools
        run: python -m compileall -q tools/scripts

  phase22-focused-tests:
    name: PHASE22 Focused Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml loguru pydantic requests

      - name: Run PHASE22 focused test suite
        run: |
          pytest -q \
            tests/platform/test_langsmith_trace_adapter.py \
            tests/platform/test_langsmith_adapter_factory.py \
            tests/platform/test_langsmith_redaction.py \
            tests/repo/test_phase22_eval_package_contract.py \
            tests/evals/test_enterprise_rag_paired_benchmark.py \
            tests/evals/test_profile_runners.py \
            tests/repo/test_phase22_cleanup_boundary.py \
            tests/repo/test_static_target_layer_imports.py \
            tests/repo/test_repo_structure_consistency.py \
            tests/api/test_layered_api_boundaries.py \
            tests/api/test_fastapi_jwt_auth_compat.py \
            tests/repo/test_agent_commit_attribution.py \
            tests/repo/test_agent_pr_body.py \
            -p no:cacheprovider

  verification-evidence:
    name: Generate Verification Evidence & Summary
    needs: [repository-gates, phase22-focused-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate evidence artifacts and step summary
        run: |
          mkdir -p artifacts/phase22-verification
          python tools/scripts/generate_phase22_evidence.py artifacts/phase22-verification

      - name: Upload verification evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase22-verification-evidence
          path: artifacts/phase22-verification
          if-no-files-found: error
          retention-days: 14
