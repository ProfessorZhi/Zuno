name: PHASE22 Contract Verification

on:
  push:
    branches:
      - codex/goal05-phase15-sandbox-repair
  pull_request:
    branches:
      - codex/goal05-phase15-sandbox-repair
      - codex/goal05-target-coverage-audit
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src/backend

concurrency:
  group: phase22-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-gates:
    name: Repository Gates & Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies from lock file
        run: |
          poetry install --with test --sync --no-interaction --no-root
          git diff --exit-code -- poetry.lock pyproject.toml

      - name: Prepare log directory
        run: mkdir -p artifacts/phase22-verification

      - name: Resolve Base SHA and verify Git formatting
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          ZERO_SHA="0000000000000000000000000000000000000000"

          resolve_base_sha() {
            if [ "${EVENT_NAME}" = "pull_request" ]; then
              SHA="${PR_BASE_SHA}"
              echo "Event: pull_request, using PR base SHA: ${SHA}" >&2
            elif [ "${EVENT_NAME}" = "push" ]; then
              SHA="${PUSH_BEFORE_SHA}"
              if [ -z "${SHA}" ] || [ "${SHA}" = "${ZERO_SHA}" ]; then
                echo "Event: push, before SHA is all-zeros (new branch); falling back to merge-base." >&2
                git fetch origin codex/goal05-phase15-sandbox-repair >&2
                SHA="$(git merge-base HEAD origin/codex/goal05-phase15-sandbox-repair)"
              fi
              echo "Event: push, using SHA: ${SHA}" >&2
            elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
              git fetch origin codex/goal05-phase15-sandbox-repair >&2
              SHA="$(git merge-base HEAD origin/codex/goal05-phase15-sandbox-repair)"
              echo "Event: workflow_dispatch, using merge-base SHA: ${SHA}" >&2
            else
              echo "ERROR: Unknown event name: ${EVENT_NAME}" >&2
              exit 1
            fi

            if [ -z "${SHA}" ]; then
              echo "ERROR: Resolved base SHA is empty." >&2
              exit 1
            fi

            if [ "${SHA}" = "${ZERO_SHA}" ]; then
              echo "ERROR: Resolved base SHA is all-zeros (initial push with no history)." >&2
              exit 1
            fi

            if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
              echo "ERROR: Resolved base SHA '${SHA}' is not a valid commit." >&2
              exit 1
            fi

            echo "${SHA}"
          }

          RESOLVED_BASE_SHA="$(resolve_base_sha)"
          echo "RESOLVED_BASE_SHA=${RESOLVED_BASE_SHA}" >> "$GITHUB_ENV"
          echo "Resolved base SHA: ${RESOLVED_BASE_SHA}"

          git diff --check "${RESOLVED_BASE_SHA}...HEAD" -- '*.py' '*.yml' '*.yaml'

      - name: Run all repository gate verifiers
        run: |
          set -o pipefail
          {
            poetry run python tools/agent/render_architecture.py --check && \
            poetry run python tools/scripts/verify_docs_entrypoints.py && \
            poetry run python tools/scripts/verify_repo_structure.py && \
            poetry run python tools/scripts/verify_agent_core_target_protocols.py && \
            poetry run python tools/scripts/verify_phase22_cleanup_boundary.py && \
            poetry run python tools/scripts/verify_phase0_runtime_recovery.py && \
            poetry run python .agent/scripts/verify_agent_system.py && \
            poetry run python .agent/scripts/verify_doc_boundaries.py && \
            poetry run python tools/scripts/verify_current_program.py && \
            poetry run python tools/scripts/verify_agent_commit_attribution.py --base ${{ github.event.pull_request.base.sha || 'origin/codex/goal05-phase15-sandbox-repair' }} --allow-human-only && \
            poetry run python -m compileall -q src/backend && \
            poetry run python -m compileall -q tools/evals/zuno && \
            poetry run python -m compileall -q tools/scripts && \
            poetry run python -c "import zuno.api.services.workspace_task_runtime"
          } 2>&1 | tee artifacts/phase22-verification/repository-gates.log

      - name: Upload repository gates logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-gates-logs
          path: artifacts/phase22-verification/repository-gates.log

  phase22-focused-tests:
    name: PHASE22 Focused Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies from lock file
        run: |
          poetry install --with test --sync --no-interaction --no-root
          git diff --exit-code -- poetry.lock pyproject.toml

      - name: Prepare log directory
        run: mkdir -p artifacts/phase22-verification

      - name: Run PHASE22 focused test suite
        run: |
          set -o pipefail
          poetry run python -m pytest -q \
            tests/platform/test_langsmith_trace_adapter.py \
            tests/platform/test_langsmith_adapter_factory.py \
            tests/platform/test_langsmith_redaction.py \
            tests/repo/test_phase22_eval_package_contract.py \
            tests/evals/test_enterprise_rag_paired_benchmark.py \
            tests/evals/test_profile_runners.py \
            tests/evals/test_canonical_profile_runners.py \
            tests/repo/test_phase22_cleanup_boundary.py \
            tests/repo/test_static_target_layer_imports.py \
            tests/repo/test_repo_structure_consistency.py \
            tests/api/test_layered_api_boundaries.py \
            tests/api/test_fastapi_jwt_auth_compat.py \
            tests/repo/test_agent_commit_attribution.py \
            tests/repo/test_agent_pr_body.py \
            tests/repo/test_phase22_verification_truth.py \
            tests/agent/test_workspace_task_runtime_import_smoke.py \
            tests/agent/test_workspace_phase22_repair.py \
            tests/agent/test_workspace_single_controller_cutover.py \
            tests/agent/test_workspace_simple_agent.py \
            --junitxml=artifacts/phase22-verification/pytest-results.xml \
            -p no:cacheprovider 2>&1 | tee artifacts/phase22-verification/pytest.log

      - name: Upload focused tests logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-tests-logs
          path: |
            artifacts/phase22-verification/pytest-results.xml
            artifacts/phase22-verification/pytest.log

  verification-evidence:
    name: Generate Verification Evidence & Summary
    needs: [repository-gates, phase22-focused-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      REPO_GATES_RESULT: ${{ needs.repository-gates.result }}
      FOCUSED_TESTS_RESULT: ${{ needs.phase22-focused-tests.result }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies from lock file
        run: |
          poetry install --with test --sync --no-interaction --no-root

      - name: Download job artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/phase22-verification
          merge-multiple: true

      - name: Generate evidence artifacts and step summary
        run: |
          poetry run python tools/scripts/generate_phase22_evidence.py artifacts/phase22-verification

      - name: Upload verification evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase22-verification-evidence
          path: artifacts/phase22-verification
          if-no-files-found: error
          retention-days: 14
