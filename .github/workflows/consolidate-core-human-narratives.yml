name: Consolidate core human narratives

on:
  push:
    branches: [docs/core-narrative-continuity]
    paths:
      - "tools/scripts/_consolidate_core_human_narratives.py"
      - ".github/workflows/consolidate-core-human-narratives.yml"

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/core-narrative-continuity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consolidate core narratives and verify
        run: |
          python tools/scripts/_consolidate_core_human_narratives.py
          python tools/scripts/verify_architecture_human_readability.py
          python tools/scripts/verify_architecture_semantic_alignment.py
          python tools/scripts/verify_architecture_writing_standard.py
          python tools/agent/render_architecture.py --check
          python tools/scripts/verify_docs_entrypoints.py
          python tools/scripts/verify_markdown_internal_links.py
          git diff --check
      - name: Commit narrative structure
        run: |
          if git diff --quiet; then
            echo "No consolidation changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: consolidate project and architecture narratives"
          git push origin HEAD:docs/core-narrative-continuity
