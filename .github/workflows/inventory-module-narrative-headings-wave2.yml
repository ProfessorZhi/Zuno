name: Inventory remaining module narrative headings

on:
  push:
    branches: [docs/module-narrative-continuity-wave2]
    paths:
      - ".github/workflows/inventory-module-narrative-headings-wave2.yml"

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/module-narrative-continuity-wave2
      - name: Print heading inventory
        run: |
          for file in \
            docs/modules/runtime/README.md \
            docs/modules/capability/README.md \
            docs/modules/effects/README.md \
            docs/modules/model-gateway/README.md \
            docs/modules/security/README.md \
            docs/modules/evaluation/README.md; do
            echo "===== $file ====="
            grep -nE '^#{2,4} ' "$file" || true
            echo
          done
