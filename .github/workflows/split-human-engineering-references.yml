name: Split human and engineering references

on:
  push:
    branches: [docs/split-human-engineering-references]
    paths:
      - "tools/scripts/_split_human_engineering_references.py"
      - ".github/workflows/split-human-engineering-references.yml"

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/split-human-engineering-references
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Split canonical documents
        run: |
          python tools/scripts/_split_human_engineering_references.py
          git diff --check
      - name: Commit split
        run: |
          if git diff --quiet; then
            echo "No split changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: split human narratives from engineering references"
          git push origin HEAD:docs/split-human-engineering-references
