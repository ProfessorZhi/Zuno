name: Rewrite project positioning

on:
  push:
    branches: [docs/project-narrative-boundary]
    paths:
      - "tools/scripts/_rewrite_project_positioning_section.py"
      - ".github/workflows/rewrite-project-positioning.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/project-narrative-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rewrite project positioning and verify
        run: |
          python tools/scripts/_rewrite_project_positioning_section.py
          python tools/scripts/verify_architecture_human_readability.py
          python tools/scripts/verify_architecture_semantic_alignment.py
          python tools/scripts/verify_architecture_writing_standard.py
          python tools/scripts/verify_docs_entrypoints.py
          python tools/scripts/verify_markdown_internal_links.py
          git diff --check
      - name: Commit project narrative rewrite
        run: |
          if git diff --quiet; then
            echo "No rewrite changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: keep project narrative above architecture detail"
          git push origin HEAD:docs/project-narrative-boundary
