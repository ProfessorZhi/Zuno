name: Temporary documentation path migration

on:
  push:
    branches: [docs/research-maintenance-ia]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/research-maintenance-ia
          fetch-depth: 0
      - name: Migrate remaining active documentation routes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('docs/architecture/architecture.md'): {
                  '../history/red-blue/README.md': '../maintenance/history/red-blue/README.md',
              },
              Path('docs/decisions/0013-round-02-responsibility-taxonomy.md'): {
                  '../history/red-blue/manual-round-02-overall-architecture-freeze-review.md': '../maintenance/history/red-blue/manual-round-02-overall-architecture-freeze-review.md',
              },
              Path('docs/decisions/0014-round-02-cross-boundary-authority-and-recovery.md'): {
                  '../history/red-blue/manual-round-02-overall-architecture-freeze-review.md': '../maintenance/history/red-blue/manual-round-02-overall-architecture-freeze-review.md',
              },
          }
          for path, mapping in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f'missing expected route in {path}: {old}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'no route changed in {path}')
              path.write_text(text, encoding='utf-8')

          index = Path('docs/README.md')
          text = index.read_text(encoding='utf-8')
          marker = 'maintenance/history/red-blue/'
          if marker not in text:
              anchor = '- `maintenance/`：当前 Runbook、Agent/GitHub 工作流与历史审查；不拥有当前架构真相。'
              if anchor not in text:
                  raise SystemExit('docs/README maintenance owner anchor missing')
              text = text.replace(anchor, anchor + '\n  - Red / Blue archive route: `maintenance/history/red-blue/`。')
              index.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/tmp-doc-path-migrate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture/architecture.md docs/decisions/0013-round-02-responsibility-taxonomy.md docs/decisions/0014-round-02-cross-boundary-authority-and-recovery.md docs/README.md
          git commit -m "docs: finish maintenance path migration"
          git push origin HEAD:docs/research-maintenance-ia
