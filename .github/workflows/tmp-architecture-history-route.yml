name: Temporary architecture history route migration

on:
  push:
    branches:
      - docs/research-maintenance-ia

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/research-maintenance-ia
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused validation dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml
      - name: Migrate canonical history route
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/architecture/architecture.md')
          text = path.read_text(encoding='utf-8')
          old = 'docs/history/red-blue/'
          new = 'docs/maintenance/history/red-blue/'
          if old not in text:
              raise SystemExit('expected old history route was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          if grep -n 'docs/history/red-blue/' docs/architecture/architecture.md; then
            echo 'old history route still present' >&2
            exit 1
          fi
          grep -n 'docs/maintenance/history/red-blue/' docs/architecture/architecture.md
      - name: Validate focused architecture routes
        run: |
          python tools/agent/render_architecture.py --check
          python tools/scripts/verify_architecture_document_set.py
          python tools/scripts/verify_architecture_human_readability.py
          pytest -q tests/repo/test_architecture_document_set.py tests/repo/test_docs_entrypoints.py -p no:cacheprovider
      - name: Commit migration and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-architecture-history-route.yml
          git add docs/architecture/architecture.md
          git commit -m 'docs: finish architecture history route migration'
          git push origin HEAD:docs/research-maintenance-ia
