name: Temporary textbook rewrite

on:
  push:
    branches:
      - docs/textbook-style-rewrite-v1

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/textbook-style-rewrite-v1

      - name: Apply textbook rewrite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          project = Path('.tmp/textbook-project.md').read_text(encoding='utf-8')
          Path('docs/project/project.md').write_text(project, encoding='utf-8')

          arch_path = Path('docs/architecture/architecture.md')
          original = arch_path.read_text(encoding='utf-8')
          meta_start = original.index('<!--')
          meta_end = original.index('-->', meta_start) + 3
          metadata = original[meta_start:meta_end]

          part_b_marker = '## Part B — Detailed Architecture Specification'
          part_b_start = original.index(part_b_marker)
          part_b = original[part_b_start:]

          prefix = Path('.tmp/textbook-architecture-prefix.md').read_text(encoding='utf-8').strip()
          part_a = Path('.tmp/textbook-architecture-part-a.md').read_text(encoding='utf-8').strip()

          arch_path.write_text(
              prefix + '\n\n' + metadata + '\n\n' + part_a + '\n\n' + part_b,
              encoding='utf-8',
          )
          PY

      - name: Commit rewritten docs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .tmp/textbook-project.md
          git rm .tmp/textbook-architecture-prefix.md
          git rm .tmp/textbook-architecture-part-a.md
          git rm .github/workflows/tmp-textbook-rewrite.yml
          git add docs/project/project.md docs/architecture/architecture.md
          git commit -m 'docs: rewrite project and architecture as textbook narrative'
          git push origin HEAD:docs/textbook-style-rewrite-v1
