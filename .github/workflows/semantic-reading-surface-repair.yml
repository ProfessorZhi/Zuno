name: Semantic reading surface repair

on:
  push:
    branches: [docs/semantic-reading-surfaces]
    paths:
      - "tools/scripts/_repair_semantic_reading_surface_migration.py"
      - ".github/workflows/semantic-reading-surface-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/semantic-reading-surfaces
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic repair
        run: |
          python tools/scripts/_repair_semantic_reading_surface_migration.py
          git diff --check
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No repair changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: repair semantic reading surface migration"
          git push origin HEAD:docs/semantic-reading-surfaces
