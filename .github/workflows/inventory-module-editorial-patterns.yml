name: Inventory module editorial patterns

on:
  push:
    branches: [docs/module-narrative-editorial-wave1]
    paths:
      - ".github/workflows/inventory-module-editorial-patterns.yml"

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/module-narrative-editorial-wave1
      - name: Inventory editorial patterns
        run: |
          files=(
            docs/modules/application/README.md
            docs/modules/domain/README.md
            docs/modules/knowledge/README.md
            docs/modules/runtime/README.md
            docs/modules/capability/README.md
            docs/modules/effects/README.md
            docs/modules/model-gateway/README.md
            docs/modules/security/README.md
            docs/modules/evaluation/README.md
          )
          for file in "${files[@]}"; do
            echo "===== $file ====="
            echo "-- meta/editorial --"
            grep -nE '贯穿这一篇|贯穿本文|前半篇|接下来|到这里|下面|第一次阅读|先做一次删除测试|可以只看|本文|这一篇' "$file" || true
            echo "-- contrast / question wording --"
            grep -nE '不是.*而是|不是“|为什么' "$file" || true
            echo
          done
