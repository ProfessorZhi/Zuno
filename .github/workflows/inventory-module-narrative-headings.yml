name: Inventory module narrative headings

on:
  push:
    branches: [docs/module-narrative-continuity-wave1]
    paths:
      - ".github/workflows/inventory-module-narrative-headings.yml"

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/module-narrative-continuity-wave1
      - name: Print heading inventory
        run: |
          for file in \
            docs/modules/README.md \
            docs/modules/application/README.md \
            docs/modules/domain/README.md \
            docs/modules/knowledge/README.md; do
            echo "===== $file ====="
            grep -nE '^#{2,4} ' "$file" || true
            echo
          done
