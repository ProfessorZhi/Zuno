name: Narrative wording polish

on:
  push:
    branches:
      - docs/narrative-editing-pass-v1
    paths:
      - .github/workflows/narrative-polish.yml

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/narrative-editing-pass-v1
      - name: Fix premature closing transitions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            'docs/modules/01-application-integration.md': (
              '**最后回到删除条件。**',
              '**到这里先做一次删除测试。**'
            ),
            'docs/modules/07-model-gateway.md': (
              '**最后回到边界本身。**',
              '**到这里先收束一次边界本身。**'
            ),
            'docs/modules/08-security-governance.md': (
              '**最后回到 Build / Buy。**',
              '**到这里先回到 Build / Buy。**'
            ),
            'docs/modules/09-observability-evaluation.md': (
              '**最后必须限制 Evidence 自己的权力。**',
              '**在继续讨论更多观测和评测细节前，先限制 Evidence 自己的权力。**'
            ),
            'docs/architecture/architecture.md': (
              '**阶段七：最后一个问题不是“还能再加什么机制”，而是“哪些复杂度值得活下来”。**',
              '**阶段七的主问题不是“还能再加什么机制”，而是“哪些复杂度值得活下来”。**'
            ),
          }
          for path, (old, new) in replacements.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and self-delete
        shell: bash
        run: |
          rm .github/workflows/narrative-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github/workflows/narrative-polish.yml
          git commit -m "docs: polish narrative transitions"
          git push origin HEAD:docs/narrative-editing-pass-v1
