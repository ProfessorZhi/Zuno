name: Semantic docs migration helper

on:
  push:
    branches: [docs/semantic-reading-surfaces]
    paths:
      - "tools/scripts/_migrate_semantic_docs_paths.py"
      - ".github/workflows/semantic-docs-migration-helper.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/semantic-reading-surfaces
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic path migration
        run: |
          python tools/scripts/_migrate_semantic_docs_paths.py
          git diff --check
      - name: Commit migrated paths
        run: |
          if git diff --quiet; then
            echo "No path changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: repair semantic documentation paths"
          git push origin HEAD:docs/semantic-reading-surfaces
