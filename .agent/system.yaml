version: 3

purpose: "Route Zuno work to the new Product/Domain/Agents/Knowledge/Services/Data/Security/Eval/Deployment canonical taxonomy, Programs, and verification."

system_identity:
  name: "Zuno Local Agent Skill System"
  bootloader: "AGENTS.md"
  local_skills_root: ".agent/references"
  template_root: ".agent/templates"
  active_program_root: ".agent/programs"
  formal_truth_root: "docs"
  formal_project_root: "docs/project"
  formal_project_facts_root: "docs/project/facts"
  formal_architecture_root: "docs/project/architecture"
  formal_taxonomy_root: "docs/project"
  formal_status_root: "docs/status"
  history_root: "docs/history"

runtime_boundary:
  product_runtime_target: "Python-only Microservice Architecture"
  product_runtime_current: "FastAPI backend + RabbitMQ worker in current Compose evidence; not yet target microservice evidence"
  agent_runtime: "Composable Multi-Agent Runtime Service; profiles/workers are not automatically services"
  language_policy: "Python-only backend; external Java/Spring systems integrate through versioned protocols"
  engineering_parallelism: "parallel agents are engineering workflow helpers and do not change product runtime architecture"

program_rules:
  current_program_root: ".agent/programs"
  phase_filename_pattern: "retired-do-not-create"
  new_program_first_phase: "architecture-review-required"
  replaced_program_policy: "compress approved history into docs/history summaries; do not keep raw phase materials or competing active truth"

work_modes:
  branch_prefix: "codex/"
  task_isolation_unit: "worktree + branch"
  main_thread_can_self_execute: true
  main_thread_can_delegate: true
  coordinator_role: "scope, contract freeze, conflict resolution, integrated verification, merge, and evidence reporting"
  require_disjoint_write_scope_for_parallel_tasks: true
  require_commit_and_push_before_merge: true

architecture_directory_contract:
  formal_files:
    - "docs/project/architecture/README.md"
    - "docs/project/architecture/architecture.md"
    - "docs/project/architecture/architecture-views.md"
    - "docs/project/architecture/architecture.html"
  canonical_taxonomy:
    - "docs/project/product/product-architecture.md"
    - "docs/project/domain/legal-domain-model.md"
    - "docs/project/domain/domain-state-lifecycle.md"
    - "docs/project/agents/agent-platform.md"
    - "docs/project/agents/multi-agent-runtime.md"
    - "docs/project/knowledge/knowledge-evidence-architecture.md"
    - "docs/project/services/service-architecture.md"
    - "docs/project/data/data-ownership-and-recovery.md"
    - "docs/project/security/security-architecture.md"
    - "docs/project/eval/legal-eval-and-benchmark.md"
    - "docs/project/deployment/microservice-deployment.md"
  legacy_taxonomy: "docs/project/modules/README.md and docs/project/modules/01..11 are Superseded migration material"
  presentation_pair:
    - "docs/project/architecture/architecture-views.md"
    - "docs/project/architecture/architecture.html"
  visual_source_role: "architecture-views.md and architecture.html are one paired diagram presentation surface; neither is an independent architecture fact source"
  reading_protocol:
    human_question: "read architecture.md, then the relevant canonical taxonomy document"
    implementation_or_review: "read architecture.md, owning taxonomy document, ADR/shared contracts, status/evidence, and active Program if any"
    no_mirror_rule: "do not create human/spec mirrors or a second Service/Domain/State registry"
  forbidden_content:
    - "module-specific second architecture documents in architecture/"
    - "production readiness claims without evidence"
    - "Program plan in architecture/"
    - "repo ownership matrix in architecture/"

canonical_ownership:
  domain_fact_owner: "docs/project/domain/legal-domain-model.md"
  domain_lifecycle_owner: "docs/project/domain/domain-state-lifecycle.md"
  runtime_control_owner: "docs/project/agents/agent-platform.md"
  multi_agent_owner: "docs/project/agents/multi-agent-runtime.md"
  knowledge_owner: "docs/project/knowledge/knowledge-evidence-architecture.md"
  service_boundary_owner: "docs/project/services/service-architecture.md"
  data_recovery_owner: "docs/project/data/data-ownership-and-recovery.md"
  security_decision_owner: "docs/project/security/security-architecture.md"
  eval_fact_owner: "docs/project/eval/legal-eval-and-benchmark.md"
  deployment_owner: "docs/project/deployment/microservice-deployment.md"

shared_contracts:
  adr: "docs/decisions/0003-wave1-cross-module-contract-freeze.md"
  registry: "docs/governance/wave1-cross-module-contract-registry.md"
  state_boundary_adr: "docs/decisions/0008-legal-domain-kernel-and-host-boundary.md"
  language_adr: "docs/decisions/0009-python-only-backend.md"
  service_adr: "docs/decisions/0010-microservice-target-and-service-boundaries.md"
  taxonomy_adr: "docs/decisions/0011-architecture-document-taxonomy.md"

skill_routes:
  - name: "architecture-and-document-governance"
    match:
      paths:
        - "README.md"
        - "docs/**"
        - "AGENTS.md"
        - ".agent/**"
    docs_sync:
      - "docs/README.md"
      - "docs/project/README.md"
      - "docs/project/architecture/"
      - "docs/project/product/"
      - "docs/project/domain/"
      - "docs/project/agents/"
      - "docs/project/knowledge/"
      - "docs/project/services/"
      - "docs/project/data/"
      - "docs/project/security/"
      - "docs/project/eval/"
      - "docs/project/deployment/"
      - "docs/decisions/"
      - "docs/governance/"
      - ".agent/system.yaml"
    verify:
      - "git diff --check"
      - "python tools/scripts/verify_architecture_document_set.py"
      - "python tools/agent/render_architecture.py --check"
      - "python tools/scripts/verify_docs_entrypoints.py"
      - "python tools/scripts/verify_markdown_internal_links.py"
      - "python tools/scripts/verify_architecture_writing_standard.py"
      - "python tools/scripts/verify_architecture_human_readability.py"
      - "python .agent/scripts/verify_agent_system.py"
      - "python .agent/scripts/verify_doc_boundaries.py"
      - "python tools/scripts/verify_red_blue_round_v2.py"
      - "python tools/scripts/verify_red_blue_round_v3.py"
      - "python tools/scripts/verify_red_blue_score_v3.py"
      - "python tools/scripts/verify_canonical_diff_v3.py"
      - "python tools/scripts/verify_red_blue_round_v31.py"
      - "python tools/scripts/verify_document_quality_v31.py"
      - "python tools/scripts/verify_document_normalization_v311.py"
      - "python tools/scripts/verify_human_writing_v312.py"
      - "python tools/scripts/verify_red_blue_round_v312.py"
      - "python tools/scripts/verify_red_blue_round_v313.py"
      - "python tools/scripts/verify_closure_semantic_audit_v3131.py"
      - "python tools/scripts/verify_red_blue_repair_v1.py"
      - "python tools/scripts/verify_red_blue_evidence_closure_v1.py"
      - "python tools/scripts/verify_red_blue_p0_v4_execution_v1.py"
      - "python tools/scripts/verify_red_blue_gate_realignment_v1.py"

  - name: "backend-agent-runtime"
    match:
      paths:
        - "src/backend/zuno/agent/**"
    docs_sync:
      - "docs/project/agents/agent-platform.md"
      - "docs/project/agents/multi-agent-runtime.md"
      - "docs/project/domain/"
      - "docs/project/services/service-architecture.md"
      - "docs/project/data/data-ownership-and-recovery.md"

  - name: "knowledge-and-evidence"
    match:
      paths:
        - "src/backend/zuno/knowledge/**"
        - "src/backend/zuno/memory/**"
        - "src/backend/zuno/platform/services/rag/**"
        - "src/backend/zuno/platform/services/graphrag/**"
    docs_sync:
      - "docs/project/knowledge/knowledge-evidence-architecture.md"
      - "docs/project/domain/legal-domain-model.md"
      - "docs/project/eval/legal-eval-and-benchmark.md"

  - name: "service-and-tool-boundary"
    match:
      paths:
        - "src/backend/zuno/api/**"
        - "src/backend/zuno/capability/**"
        - "src/backend/zuno/platform/**"
        - "infra/docker/**"
    docs_sync:
      - "docs/project/services/service-architecture.md"
      - "docs/project/security/security-architecture.md"
      - "docs/project/data/data-ownership-and-recovery.md"
      - "docs/project/deployment/microservice-deployment.md"

stop_conditions:
  - "public API field rename"
  - "database schema change"
  - "dependency upgrade"
  - "security boundary change"
  - "Target behavior promoted to Current without evidence"
  - "architecture taxonomy changed without ADR and entrypoint migration"
