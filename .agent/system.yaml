version: "2026-08-16"
system_identity: "Zuno Local Agent System"

runtime_boundary:
  agent_role: "repository_workflow_and_documentation_coordinator"
  product_runtime_is_not_agent_collaboration: true
  source_of_truth: "docs/"
  project_story_root: "docs/project"
  architecture_root: "docs/architecture"
  module_design_root: "docs/modules"
  module_design_state: "deep-design-v2"
  module_detail_design_candidate: "candidate-v1"
  module_detail_design_candidate_modules: ["01", "02", "03", "04", "05", "06", "07", "08", "09"]
  module_detail_freeze: false
  evidence_root: "docs/evidence"
  review_history_root: "docs/history/red-blue"

program_rules:
  current_program_owner: ".agent/programs/current.md"
  implementation_requires_explicit_user_gate: true
  target_does_not_equal_current: true
  detail_candidate_does_not_equal_freeze: true
  module_freeze_precedes_implementation_planning: true
  history_is_git_archaeology_except_review_records: true
  replaced_program_policy: "remove obsolete workspace copies after approved disposition; Git history remains the archive of record"
  preserve_uncommitted_user_files: true

local_skill_registry:
  mode: "REPOSITORY_LOCAL_EXPLICIT_ONLY"
  discovery: "EXPLICIT_ONLY"
  note: "当前仓库没有 active local skill workspace；需要 Red/Blue 或项目恢复时按 AGENTS.md 和 docs/history/red-blue/ 的规则人工协调。"

canonical_owners:
  project_readme: "docs/project/README.md"
  project_narrative: "docs/project/project.md"
  project_fact_provenance: "docs/governance/project-fact-provenance.md"
  human_first_documentation_standard: "docs/governance/human-first-documentation-standard.md"
  overall_architecture: "docs/architecture/architecture.md"
  architecture_views: "docs/architecture/architecture-views.md + docs/architecture/architecture.html"
  modules: "docs/modules/README.md + docs/modules/01-*.md through 09-*.md"
  detail_design_candidates: "docs/modules/01-*.md through 09-*.md B14.1-B14.8"
  decisions: "docs/decisions/"
  evidence: "docs/evidence/"
  review_history: "docs/history/red-blue/"
  operations: "docs/operations/"
  terminology: "docs/terminology.md"

skill_routes:
  documentation:
    read_first:
      - "AGENTS.md"
      - "docs/README.md"
      - "docs/project/README.md"
      - ".agent/references/workflow.md"
  project_understanding:
    read_first:
      - "docs/project/project.md"
      - "docs/governance/project-fact-provenance.md"
  architecture:
    read_first:
      - "docs/project/project.md"
      - "docs/architecture/README.md"
      - "docs/architecture/architecture.md"
      - "docs/modules/README.md"
      - "docs/decisions/README.md"
      - "docs/evidence/README.md"
  architecture_human_reading:
    read_first:
      - "docs/project/project.md"
      - "docs/architecture/README.md"
      - "docs/architecture/architecture.md"
      - "docs/modules/README.md"
  architecture_review:
    read_first:
      - "docs/project/project.md"
      - "docs/architecture/architecture.md"
      - "docs/modules/README.md"
      - "docs/evidence/README.md"
      - "docs/history/red-blue/README.md"
  module_design:
    read_first:
      - "docs/architecture/architecture.md"
      - "docs/modules/README.md"
      - "docs/decisions/README.md"
      - "docs/evidence/README.md"
      - "docs/governance/human-first-documentation-standard.md"
  detail_design_review:
    read_first:
      - "docs/architecture/architecture.md"
      - "docs/modules/README.md"
      - "docs/modules/01-application-integration.md"
      - "docs/modules/02-legal-domain-work-product.md"
      - "docs/modules/03-knowledge-evidence.md"
      - "docs/modules/04-agent-runtime-control.md"
      - "docs/modules/05-capability-skill.md"
      - "docs/modules/06-tool-runtime-effects.md"
      - "docs/modules/07-model-gateway.md"
      - "docs/modules/08-security-governance.md"
      - "docs/modules/09-observability-evaluation.md"
      - "docs/decisions/README.md"
      - "docs/evidence/README.md"
      - "docs/governance/human-first-documentation-standard.md"
  architecture_implementation:
    read_first:
      - "docs/architecture/README.md"
      - "docs/architecture/architecture.md"
      - "docs/modules/README.md"
      - "docs/decisions/README.md"
      - "docs/evidence/README.md"
      - "docs/governance/human-first-documentation-standard.md"
  runtime:
    read_first:
      - "docs/architecture/README.md"
      - "docs/architecture/architecture.md"
      - "docs/modules/README.md"
      - "docs/evidence/README.md"
      - "docs/governance/human-first-documentation-standard.md"
      - ".agent/references/code-map.md"
  verification:
    read_first:
      - ".agent/references/verification-map.md"
      - "docs/evidence/README.md"

verification:
  docs_entrypoints: "python tools/scripts/verify_docs_entrypoints.py"
  markdown_links: "python tools/scripts/verify_markdown_internal_links.py"
  repo_structure: "python tools/scripts/verify_repo_structure.py"
  agent_system: "python .agent/scripts/verify_agent_system.py"
  doc_boundaries: "python .agent/scripts/verify_doc_boundaries.py"
  architecture_set: "python tools/scripts/verify_architecture_document_set.py"