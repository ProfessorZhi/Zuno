version: 3

purpose: "Route Zuno work to consolidated facts, architecture, modules, decisions, governance, evidence, history, and the lightweight interview lab."

system_identity:
  name: "Zuno Local Agent Skill System"
  bootloader: "AGENTS.md"
  local_skills_root: ".agent/references"
  project_skill_root: "project-reconstruction-lab/skills"
  template_root: ".agent/templates"
  active_program_root: ".agent/programs"
  formal_truth_root: "docs"
  formal_project_root: "docs"
  formal_project_facts_root: "docs/facts"
  formal_architecture_root: "docs/architecture"
  formal_modules_root: "docs/modules"
  history_root: "docs/history"

local_skill_registry:
  mode: "REPOSITORY_LOCAL_NOT_EXPORTED"
  discovery: "PATH_TRIGGERED"
  instruction: "匹配项目重建或架构面试任务后，读取对应 SKILL.md；不要求安装到全局 Skill 目录。"
  skills:
    - name: "red-team-interviewer"
      path: "project-reconstruction-lab/skills/red-team-interviewer/SKILL.md"
      trigger: "项目真实性、个人贡献、代码链路或大厂面试深挖"
    - name: "architecture-red-blue-loop"
      path: "project-reconstruction-lab/skills/architecture-red-blue-loop/SKILL.md"
      trigger: "架构必要性、替代方案、Red/Blue 攻防或复杂度收敛"
    - name: "jd-enterprise-project"
      path: "project-reconstruction-lab/skills/jd-enterprise-project/SKILL.md"
      trigger: "根据 JD、目标岗位或项目约束推导可实现项目"

runtime_boundary:
  product_runtime_target: "Python-only Microservice Architecture"
  product_runtime_current: "FastAPI backend + RabbitMQ worker in current Compose evidence; not yet target microservice evidence"
  agent_runtime: "Composable Multi-Agent Runtime Service; profiles/workers are not automatically services"
  language_policy: "Python-only backend; external Java/Spring systems integrate through versioned protocols"
  engineering_parallelism: "parallel agents are engineering workflow helpers and do not change product runtime architecture"

program_rules:
  current_program_root: ".agent/programs"
  phase_filename_pattern: "retired-do-not-create"
  new_program_first_phase: "architecture-review-required"
  replaced_program_policy: "compress approved history into docs/history summaries; do not keep raw phase materials or competing active truth"

work_modes:
  branch_prefix: "codex/"
  task_isolation_unit: "worktree + branch"
  main_thread_can_self_execute: true
  main_thread_can_delegate: true
  coordinator_role: "scope, contract freeze, conflict resolution, integrated verification, merge, and evidence reporting"
  require_disjoint_write_scope_for_parallel_tasks: true
  require_commit_and_push_before_merge: true

architecture_directory_contract:
  formal_files:
    - "docs/architecture/README.md"
    - "docs/architecture/architecture.md"
    - "docs/architecture/architecture-views.md"
    - "docs/architecture/architecture.html"
  canonical_project_layers:
    - "docs/facts/"
    - "docs/architecture/"
    - "docs/modules/"
  legacy_taxonomy: "docs/history/superseded-document-taxonomy/ contains former facts, topic and module materials; it is not an active route"
  no_mirror_rule: "do not create a second Service/Domain/State registry in .agent or the Lab"

canonical_ownership:
  project_facts_owner: "docs/facts/"
  current_reality_owner: "docs/facts/current-state.md"
  target_status_owner: "docs/architecture/architecture.md"
  production_readiness_owner: "docs/facts/current-state.md"
  cross_layer_architecture_owner: "docs/architecture/architecture.md"
  architecture_views_owner: "docs/architecture/architecture-views.md and architecture.html"
  evidence_owner: "docs/evidence/"
  decision_owner: "docs/decisions/"
  governance_owner: "docs/governance/"
  formal_round_archive_owner: "docs/history/red-blue/"
  interview_lab_owner: "project-reconstruction-lab/"

shared_contracts:
  adr: "docs/decisions/0003-wave1-cross-module-contract-freeze.md"
  state_boundary_adr: "docs/decisions/0008-legal-domain-kernel-and-host-boundary.md"
  language_adr: "docs/decisions/0009-python-only-backend.md"
  service_adr: "docs/decisions/0010-microservice-target-and-service-boundaries.md"
  taxonomy_adr: "docs/decisions/0011-architecture-document-taxonomy.md"

skill_routes:
  - name: "architecture-and-document-governance"
    match:
      paths:
        - "README.md"
        - "docs/**"
        - "AGENTS.md"
        - ".agent/**"
    docs_sync:
      - "docs/README.md"
      - "docs/architecture/"
      - "docs/facts/"
      - "docs/modules/README.md"
      - "docs/decisions/"
      - "docs/governance/"
      - ".agent/system.yaml"
    verify:
      - "git diff --check"
      - "python tools/scripts/verify_docs_entrypoints.py"
      - "python tools/scripts/verify_markdown_internal_links.py"
      - "python tools/scripts/verify_architecture_document_set.py"
      - "python tools/scripts/verify_architecture_writing_standard.py"
      - "python tools/scripts/verify_architecture_human_readability.py"
      - "python .agent/scripts/verify_agent_system.py"
      - "python .agent/scripts/verify_doc_boundaries.py"

  - name: "project-reconstruction-and-interview-lab"
    match:
      paths:
        - "project-reconstruction-lab/**"
        - "docs/history/red-blue/**"
        - "tools/scripts/verify_architecture_interview_program.py"
        - "tests/repo/test_architecture_interview_program.py"
    docs_sync:
      - "project-reconstruction-lab/README.md"
      - "project-reconstruction-lab/WORKFLOW.md"
      - "project-reconstruction-lab/archive-map.md"
      - "project-reconstruction-lab/skills/"
      - "docs/history/red-blue/"
      - "docs/history/README.md"
      - "AGENTS.md"
      - ".agent/references/"
    verify:
      - "git diff --check"
      - "python tools/scripts/verify_architecture_interview_program.py"
      - "python tools/scripts/verify_docs_entrypoints.py"
      - "python tools/scripts/verify_markdown_internal_links.py"
      - "python .agent/scripts/verify_agent_system.py"
      - "python .agent/scripts/verify_doc_boundaries.py"
      - "pytest -q tests/repo/test_architecture_interview_program.py -p no:cacheprovider"

  - name: "backend-agent-runtime"
    match:
      paths:
        - "src/backend/zuno/agent/**"
    docs_sync:
      - "docs/architecture/architecture.md"
      - "docs/facts/"
      - "docs/evidence/"

  - name: "knowledge-and-evidence"
    match:
      paths:
        - "src/backend/zuno/knowledge/**"
        - "src/backend/zuno/memory/**"
        - "src/backend/zuno/platform/services/rag/**"
        - "src/backend/zuno/platform/services/graphrag/**"
    docs_sync:
      - "docs/architecture/architecture.md"
      - "docs/facts/"
      - "docs/evidence/"

  - name: "service-and-tool-boundary"
    match:
      paths:
        - "src/backend/zuno/api/**"
        - "src/backend/zuno/capability/**"
        - "src/backend/zuno/platform/**"
        - "infra/docker/**"
    docs_sync:
      - "docs/architecture/architecture.md"
      - "docs/facts/"
      - "docs/governance/"
      - "docs/evidence/"

stop_conditions:
  - "public API field rename"
  - "database schema change"
  - "dependency upgrade"
  - "security boundary change"
  - "Target behavior promoted to Current without evidence"
  - "architecture taxonomy changed without ADR and entrypoint migration"
  - "formal Round archive changed without an explicit archive disposition"
