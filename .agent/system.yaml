version: "2026-09-14-red-blue-iterative-loop"
system_identity: "Zuno Local Agent System"

runtime_boundary:
  agent_role: "repository_workflow_and_documentation_coordinator"
  product_runtime_is_not_agent_collaboration: true
  source_of_truth: "docs/"
  project_root: "docs/project"
  architecture_root: "docs/architecture"
  modules_root: "docs/modules"
  red_blue_docs_root: "docs/red-blue"
  red_blue_workspace_root: "docs/red-blue/workspace"
  red_blue_rounds_root: "docs/red-blue/rounds"
  research_root: "docs/research"
  decisions_root: "docs/decisions"
  evidence_root: "docs/evidence"
  governance_root: "docs/governance"
  terminology: "docs/governance/terminology.md"
  human_agent_workflow: "docs/governance/workflows/agent-workflow.md"
  operations_root: "docs/governance/operations"
  red_blue_runtime_root: ".agent/red-blue"
  red_blue_archive_root: "docs/red-blue/archive"

truth_rules:
  history_owner: "docs/project/"
  target_architecture_owner: "docs/architecture/"
  target_module_owner: "docs/modules/"
  decision_owner: "docs/decisions/"
  current_owner: "docs/evidence/"
  governance_owner: "docs/governance/"
  research_is_upstream_only: true
  red_blue_findings_are_non_authoritative: true
  target_does_not_equal_current: true
  pilot_does_not_equal_production: true
  team_work_does_not_equal_personal_ownership: true
  framework_capability_does_not_equal_zuno_ownership: true

view_rules:
  project_human: "docs/project/README.md"
  project_engineering: "docs/project/reference.md"
  architecture_directory_entry: "docs/architecture/README.md"
  architecture_human: "docs/architecture/architecture.md"
  architecture_engineering: "docs/architecture/reference.md"
  module_human_filename: "README.md"
  module_engineering_filename: "reference.md"
  engineering_reference_does_not_own_current: true
  human_and_engineering_must_preserve_same_authority_semantics: true

program_rules:
  current_program_owner: ".agent/programs/current.md"
  red_blue_current_owner: ".agent/red-blue/current.md"
  implementation_requires_explicit_user_gate: true
  red_blue_requires_explicit_activation: true
  blue_closed_book: true
  red_blue_modes: ["CHATGPT_AUTO", "AGENT_AUTO"]
  red_blue_resume_first: true
  red_reads_zuno_docs: false
  red_reads_only_simulated_resume_and_attack_skill: true
  simulated_resume_built_from_current_docs_before_red: true
  simulated_resume_must_match_real_resume_register: true
  simulated_resume_one_page_style: true
  simulated_resume_project_bullets_target: "4-6"
  simulated_resume_one_bullet_one_story: true
  simulated_resume_evidence_boundaries_are_compressed_not_explained: true
  resume_user_review_gate_supported: true
  resume_user_review_gate_default_for_calibration: true
  resume_must_freeze_before_red: true
  red_pressure_suite_count_default: 100
  red_live_seed_question_target_default: 8
  red_live_followups_dynamic: true
  red_live_one_question_one_intent: true
  red_pressure_suite_separate_from_live_interview: true
  red_live_static_primary_path_forbidden: true
  red_question_suite_requires_kill_switches: true
  red_user_review_gate_supported: true
  red_user_review_gate_default_for_calibration: true
  red_questions_must_freeze_before_blue: true
  red_blue_live_alternating_turns: true
  red_turn_must_commit_before_blue_turn: true
  blue_turn_must_commit_before_next_red_turn: true
  blue_candidate_skill_required: true
  blue_candidate_skill_path: ".agent/red-blue/defense-model.md"
  red_blue_skill_versions_pinned_per_round: true
  red_blue_current_round_verdict_immutable_after_reflection: true
  red_blue_round_improvement_ledger_required: true
  red_blue_resume_builder_retrospective_required: true
  red_blue_red_skill_retrospective_required: true
  red_blue_blue_skill_retrospective_required: true
  red_blue_harness_retrospective_required: true
  red_blue_improvement_user_review_gate_supported: true
  red_blue_improvement_user_review_gate_default_for_calibration: true
  red_blue_post_round_changes_next_round_only: true
  red_blue_next_resume_candidate_required: true
  red_blue_next_round_revalidates_resume: true
  round_init_must_capture_known_user_feedback: true
  red_question_review_revision_preserves_git_history: true
  red_blue_one_round_one_question_batch: false
  red_blue_retest_requires_new_round: true
  red_blue_transcript_policy: "full-observable-role-io"
  red_blue_archive_live: true
  red_blue_user_feedback_required: true
  red_blue_workflow_retrospective_required: true
  red_blue_private_chain_of_thought_not_required: true
  red_blue_github_state_bus: true
  red_blue_stage_handoff: "commit_then_reread"
  red_blue_round_branch_required: true
  red_blue_draft_pr_required: true
  chatgpt_auto_firewall_strength: "logical_github_mediated"
  chatgpt_auto_strict_blind_red_certification: false
  agent_auto_firewall_strength: "physical_context_isolation"
  agent_auto_strict_blind_red_certification: true
  human_candidate_mode_removed: true
  preserve_uncommitted_user_files: true
  architecture_change_requires_owner_or_adr: true

module_rules:
  current_target_module_count: 9
  module_count_is_documentation_invariant: false
  module_split_merge_requires_architecture_revision: true
  logical_module_does_not_imply_service: true
  semantic_paths:
    application:
      human: "docs/modules/application/README.md"
      engineering: "docs/modules/application/reference.md"
    domain:
      human: "docs/modules/domain/README.md"
      engineering: "docs/modules/domain/reference.md"
    knowledge:
      human: "docs/modules/knowledge/README.md"
      engineering: "docs/modules/knowledge/reference.md"
    runtime:
      human: "docs/modules/runtime/README.md"
      engineering: "docs/modules/runtime/reference.md"
    capability:
      human: "docs/modules/capability/README.md"
      engineering: "docs/modules/capability/reference.md"
    effects:
      human: "docs/modules/effects/README.md"
      engineering: "docs/modules/effects/reference.md"
    model_gateway:
      human: "docs/modules/model-gateway/README.md"
      engineering: "docs/modules/model-gateway/reference.md"
    security:
      human: "docs/modules/security/README.md"
      engineering: "docs/modules/security/reference.md"
    evaluation:
      human: "docs/modules/evaluation/README.md"
      engineering: "docs/modules/evaluation/reference.md"

complexity_rules:
  generic_agent_platform_reuse_preferred: true
  measurement_gated:
    - native_runtime
    - graphrag_default_path
    - reflection
    - persistent_multi_agent
    - independent_service_split

skill_routes:
  documentation:
    read_first:
      - "AGENTS.md"
      - "docs/README.md"
      - "docs/governance/documentation-architecture.md"
  project_understanding:
    read_first:
      - "docs/project/README.md"
      - "docs/project/reference.md"
      - "docs/governance/project-fact-provenance.md"
  research:
    read_first:
      - "docs/research/README.md"
  architecture_human_reading:
    read_first:
      - "docs/project/README.md"
      - "docs/architecture/architecture.md"
      - "docs/modules/README.md"
      - "docs/evidence/README.md"
  architecture_implementation:
    read_first:
      - "docs/architecture/reference.md"
      - "docs/modules/reference.md"
      - "docs/decisions/README.md"
      - "docs/evidence/README.md"
  module_design:
    read_first:
      - "docs/architecture/architecture.md"
      - "docs/architecture/reference.md"
      - "docs/modules/README.md"
      - "docs/modules/reference.md"
      - "docs/decisions/README.md"
      - "docs/evidence/README.md"
  project_fact_or_resume_claim:
    read_first:
      - "docs/project/reference.md"
      - "docs/governance/project-fact-provenance.md"
      - "docs/evidence/README.md"
  red_blue_review:
    read_first:
      - "docs/red-blue/README.md"
      - "docs/red-blue/workspace/README.md"
      - "docs/red-blue/interview-behavior-evidence-2026-09.md"
      - ".agent/red-blue/README.md"
      - ".agent/red-blue/current.md"
      - ".agent/red-blue/protocol.md"
      - ".agent/red-blue/attack-model.md"
      - ".agent/red-blue/defense-model.md"
      - ".agent/red-blue/judge.md"
  agent_workflow:
    read_first:
      - "docs/governance/workflows/agent-workflow.md"
      - ".agent/references/workflow.md"
  operations:
    read_first:
      - "docs/governance/operations/"
  verification:
    read_first:
      - ".agent/references/verification-map.md"
      - "docs/evidence/README.md"

verification:
  docs_entrypoints: "python tools/scripts/verify_docs_entrypoints.py"
  markdown_links: "python tools/scripts/verify_markdown_internal_links.py"
  repo_structure: "python tools/scripts/verify_repo_structure.py"
  agent_system: "python .agent/scripts/verify_agent_system.py"
  doc_boundaries: "python .agent/scripts/verify_doc_boundaries.py"
